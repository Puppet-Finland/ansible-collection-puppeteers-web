user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    keepalive_timeout 65;

    # Global redirect: anything on port 80 goes to HTTPS.
    # This is also the DEFAULT server for unmatched Host headers.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # TLS-only catch-all: rejects unknown hostnames on 443
    # so they don't fall through to the first vhost alphabetically.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/*.conf;
}
